spring:
  application:
    name: sms-webhook
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

trip-eleven:
  base-url : ${TRIP_ELEVEN_BASE_URL}
  username : ${TRIP_ELEVEN_USERNAME}
  password : ${TRIP_ELEVEN_PASSWORD}
  business-id: ${TRIP_ELEVEN_BUSINESS_ID}

camfit:
  base-url: ${CAMFIT_BASE_URL}
  username: ${CAMFIT_USERNAME}
  password: ${CAMFIT_PASSWORD}