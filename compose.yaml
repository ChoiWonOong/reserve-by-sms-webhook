services:
  app:
    image: reserve-by-sms-webhook:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reserve-by-sms-webhook
    restart: unless-stopped
    env_file:
      - /opt/reserve-by-sms-webhook/.env
    ports:
      - "8081:8080"
    # Spring 로그 파일을 호스트에 저장
    volumes:
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reserve-network